name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Validate and build
        working-directory: source
        run: npm test

      - name: Verify tag matches manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./source/public/manifest.json').version")"
          test "$VERSION" = "$MANIFEST_VERSION"

      - name: Assemble release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="JobClaw-v${VERSION}"
          STAGE="release/${NAME}"
          mkdir -p "$STAGE"
          cp -R source/dist/chrome-extension "$STAGE/chrome-extension"
          cp -R desktop-bridge docs skills "$STAGE/"
          cp README.md CHANGELOG.md SECURITY.md LICENSE NOTICE "$STAGE/"
          cp install-openclaw-macos.command install-local-ai-macos.command "$STAGE/"
          cd release
          zip -qr "${NAME}.zip" "${NAME}"
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="JobClaw-v${VERSION}"
          gh release create "$GITHUB_REF_NAME" \
            "release/${NAME}.zip" \
            "release/${NAME}.zip.sha256" \
            --title "JobClaw v${VERSION}" \
            --generate-notes
