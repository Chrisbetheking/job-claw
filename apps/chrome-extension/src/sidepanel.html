<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobClaw</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <div class="brand">JobClaw</div>
        <div class="subtitle">基于真实简历的求职助手</div>
      </div>
      <span class="badge">V0.1</span>
    </header>

    <nav class="tabs" aria-label="主功能">
      <button class="tab active" data-tab="analyze">岗位分析</button>
      <button class="tab" data-tab="profile">简历事实</button>
      <button class="tab" data-tab="records">记录</button>
    </nav>

    <main>
      <section id="tab-analyze" class="tab-panel active">
        <div class="card agent-card">
          <label for="agentPrompt">用一句话设置求职要求</label>
          <textarea id="agentPrompt" rows="2" placeholder="例如：找西安和北京的前端实习，不要外包和销售"></textarea>
          <button id="applyPrompt" class="button secondary">应用到筛选规则</button>
        </div>

        <div class="action-row">
          <button id="refreshJob" class="button primary">读取当前岗位</button>
          <button id="saveJob" class="button secondary" disabled>保存岗位</button>
        </div>

        <div id="status" class="status info">请打开 BOSS 直聘的岗位详情页，然后点击“读取当前岗位”。</div>

        <section id="jobCard" class="card hidden">
          <div class="card-title-row">
            <h2 id="jobTitle">岗位名称</h2>
            <span id="matchScore" class="score">--</span>
          </div>
          <div id="jobMeta" class="job-meta"></div>
          <div id="blockNotice" class="status danger hidden"></div>
          <div id="dimensions" class="dimensions"></div>
        </section>

        <section id="greetingCard" class="card hidden">
          <div class="card-title-row">
            <h2>安全招呼语</h2>
            <span id="greetingSafe" class="badge">待校验</span>
          </div>
          <textarea id="greetingText" rows="7"></textarea>
          <div id="claimChecks" class="claim-checks"></div>
          <div class="action-row">
            <button id="recheckGreeting" class="button secondary">重新校验</button>
            <button id="fillGreeting" class="button primary" disabled>填入 BOSS</button>
          </div>
          <p class="hint">仅填入输入框，不会自动点击发送。</p>
        </section>
      </section>

      <section id="tab-profile" class="tab-panel">
        <form id="profileForm" class="card form-grid">
          <h2>简历事实库</h2>
          <label>称呼<input id="profileName" placeholder="例如：小王" /></label>
          <label>当前身份/求职状态<textarea id="profileHeadline" rows="2" placeholder="例如：是计算机相关专业硕士在读，正在寻找前端开发机会"></textarea></label>
          <label>教育背景<textarea id="profileEducation" rows="2" placeholder="每行一条，只填写真实信息"></textarea></label>
          <label>目标岗位<textarea id="profileRoles" rows="2" placeholder="前端开发、前端实习生"></textarea></label>
          <label>目标地区<textarea id="profileLocations" rows="2" placeholder="西安、北京"></textarea></label>
          <label>真实技能关键词<textarea id="profileSkills" rows="4" placeholder="Vue、TypeScript、JavaScript；仅填写简历中能证明的技能"></textarea></label>
          <label>项目事实<textarea id="profileProjects" rows="6" placeholder="每行格式：项目名称｜真实事实｜关键词1,关键词2"></textarea></label>
          <label>排除关键词<textarea id="profileExcluded" rows="3" placeholder="外包、驻场、销售"></textarea></label>
          <label>允许的最低经验要求上限（年）<input id="profileExperience" type="number" min="0" max="20" value="1" /></label>
          <label>招呼语风格
            <select id="profileStyle">
              <option value="简洁">简洁</option>
              <option value="项目">项目</option>
              <option value="技术">技术</option>
            </select>
          </label>
          <button class="button primary" type="submit">保存事实库</button>
          <div id="profileStatus" class="status info">所有内容仅保存在当前浏览器本地。</div>
        </form>
      </section>

      <section id="tab-records" class="tab-panel">
        <div class="action-row">
          <button id="exportRecords" class="button secondary">导出 JSON</button>
          <button id="clearRecords" class="button danger-outline">清空记录</button>
        </div>
        <div id="recordList" class="record-list"></div>
      </section>
    </main>

    <footer>
      <p>隐私优先 · 不上传 Cookie · 不绕过验证码 · 不自动发送</p>
    </footer>
    <script type="importmap">{"imports":{"@jobclaw/core":"./core/index.js"}}</script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
